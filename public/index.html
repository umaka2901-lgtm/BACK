<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judo Shop</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--accent:#c1121f;--line:#e2e2de}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--text:#f0f0f0;--muted:#9a9a9a;--line:#333}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px;background:var(--accent);color:#fff;font-size:20px;font-weight:700}
.filters{display:grid;gap:8px;padding:12px;grid-template-columns:1fr 1fr}
.filters input,.filters select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:15px}
.filters input{grid-column:1/3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line);display:block}
.card div{padding:8px}
.brand{font-size:12px;color:var(--muted)}
.name{font-size:14px;margin:2px 0;min-height:36px}
.price{font-weight:700;color:var(--accent)}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;padding:16px}
.pager button,dialog button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px}
.pager button:disabled{opacity:.4}
dialog{width:92%;max-width:480px;border:0;border-radius:12px;background:var(--card);color:var(--text);padding:16px}
dialog img{width:100%;border-radius:8px}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sizes span{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.sizes span.out{opacity:.35;text-decoration:line-through}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>Judo Shop</header>
<div class="filters">
  <input id="q" placeholder="Поиск по названию">
  <select id="cat"><option value="">Все категории</option></select>
  <select id="sort">
    <option value="">По умолчанию</option>
    <option value="price_asc">Сначала дешёвые</option>
    <option value="price_desc">Сначала дорогие</option>
    <option value="name">По названию</option>
  </select>
</div>
<div id="grid" class="grid"></div>
<div class="pager">
  <button id="prev">←</button><span id="pg"></span><button id="next">→</button>
</div>
<dialog id="dlg"></dialog>
<script>
const $ = (id) => document.getElementById(id);
let page = 1, totalPages = 1;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function loadCats() {
  const r = await fetch("/categories");
  (await r.json()).forEach((c) => {
    const o = el("option", c.name);
    o.value = c.id;
    $("cat").appendChild(o);
  });
}

async function load() {
  const p = new URLSearchParams({ page, limit: 12 });
  if ($("q").value.trim()) p.set("q", $("q").value.trim());
  if ($("cat").value) p.set("category_id", $("cat").value);
  if ($("sort").value) p.set("sort", $("sort").value);
  const d = await (await fetch("/products?" + p)).json();
  totalPages = Math.max(d.totalPages, 1);
  const g = $("grid");
  g.textContent = "";
  if (!d.items.length) g.appendChild(el("div", "Ничего не найдено", "empty"));
  d.items.forEach((it) => {
    const c = el("div", undefined, "card");
    const img = el("img");
    img.src = it.image_url || "";
    img.alt = it.name;
    img.loading = "lazy";
    const info = el("div");
    info.append(el("div", it.brand, "brand"), el("div", it.name, "name"), el("div", "$" + it.price, "price"));
    c.append(img, info);
    c.onclick = () => openProduct(it.id);
    g.appendChild(c);
  });
  $("pg").textContent = page + " / " + totalPages;
  $("prev").disabled = page <= 1;
  $("next").disabled = page >= totalPages;
}

async function openProduct(id) {
  const p = await (await fetch("/products/" + id)).json();
  const d = $("dlg");
  d.textContent = "";
  const img = el("img");
  img.src = p.image_url || "";
  const sizes = el("div", undefined, "sizes");
  p.variants.forEach((v) => sizes.appendChild(el("span", v.size, v.stock > 0 ? "" : "out")));
  const close = el("button", "Закрыть");
  close.onclick = () => d.close();
  d.append(
    img,
    el("div", p.brand + " · " + p.category, "brand"),
    el("h3", p.name),
    el("p", p.description || ""),
    el("div", "$" + p.price, "price"),
    el("p", "Размеры (зачёркнутых нет в наличии):", "brand"),
    sizes,
    close
  );
  d.showModal();
}

let t;
$("q").oninput = () => { clearTimeout(t); t = setTimeout(() => { page = 1; load(); }, 300); };
$("cat").onchange = $("sort").onchange = () => { page = 1; load(); };
$("prev").onclick = () => { page--; load(); };
$("next").onclick = () => { page++; load(); };

loadCats().then(load);
</script>
</body>
</html>
